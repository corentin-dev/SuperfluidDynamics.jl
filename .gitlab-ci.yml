stages:
  - build
  - test
  - deploy

variables:
  # CI image: built by the build-image job, tagged per commit. The image bakes
  # in Julia 1.12.7, the project dependencies (precompiled) and the doc stack,
  # so the jobs below only pay for a fast Pkg.instantiate() against the warm
  # ~/.julia cache instead of ~10 minutes of setup.
  CI_IMAGE: $CI_REGISTRY_IMAGE/ci

# Builds (or re-tags) the CI image with buildah (daemonless; the
# quay.io/buildah/stable job image carries buildah+skopeo, so no apt install
# - which would otherwise break on the runner's read-only /etc).
# A full build only happens when Dockerfile/Project.toml/Manifest.toml
# change (content hash); otherwise the existing image is re-tagged for this
# commit (pull + tag + push, a few seconds). The other jobs always reference
# $CI_IMAGE:sha-$CI_COMMIT_SHORT_SHA. Manual (opt-in) in merge requests.
build-image:
  stage: build
  image: quay.io/buildah/stable:latest
  variables:
    # chroot isolation: no user namespaces / no privileges needed (rootful).
    BUILDAH_ISOLATION: chroot
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
    - when: on_success
  script:
    # The runner may mount /etc read-only: keep the containers-tooling config
    # in the (writable) project directory and point buildah at it through the
    # standard environment variables. The registry is marked insecure: it is
    # signed by an internal CA the job image does not trust (standard on-prem
    # workaround); storage is vfs under the project directory.
    - |
      mkdir -p containers
      printf 'unqualified-search-registries = ["docker.io"]\n\n[[registry]]\n  location = "%s"\n  insecure = true\n' "$CI_REGISTRY" > containers/registries.conf
      printf '[storage]\ndriver = "vfs"\n' > containers/storage.conf
      export CONTAINERS_REGISTRIES_CONF="$CI_PROJECT_DIR/containers/registries.conf"
      export CONTAINERS_STORAGE_CONF="$CI_PROJECT_DIR/containers/storage.conf"
    - export TAG="sha-$CI_COMMIT_SHORT_SHA"
    # Content hash of the image inputs (no git needed): unchanged inputs
    # re-tag the existing image instead of rebuilding.
    - export FILEHASH=$(cat Dockerfile Project.toml Manifest.toml test/Project.toml | sha256sum | cut -d" " -f1)
    - echo "$CI_REGISTRY_PASSWORD" | buildah login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - |
      # Flags used in this runner's pod (same as the existing in-house
      # buildah jobs): vfs storage as a flag, seccomp unconfined (the pod's
      # seccomp profile can otherwise block syscalls needed for the chroot
      # build), docker image format.
      STORAGE="--storage-driver vfs"
      if buildah pull $STORAGE "$CI_IMAGE:sha-$FILEHASH" >/dev/null 2>&1; then
        echo "CI image inputs unchanged -> re-tag the existing image"
        buildah tag  $STORAGE "$CI_IMAGE:sha-$FILEHASH" "$CI_IMAGE:$TAG"
        buildah push $STORAGE "$CI_IMAGE:$TAG"
      else
        echo "Building the CI image (Dockerfile/Project/Manifest changed)"
        buildah bud $STORAGE --security-opt seccomp=unconfined --format docker \
          --no-cache --pull-always --platform linux/amd64 \
          -t "$CI_IMAGE:sha-$FILEHASH" -t "$CI_IMAGE:$TAG" .
        buildah push $STORAGE "$CI_IMAGE:sha-$FILEHASH"
        buildah push $STORAGE "$CI_IMAGE:$TAG"
      fi

test:
  image: $CI_REGISTRY_IMAGE/ci:sha-$CI_COMMIT_SHORT_SHA
  stage: test
  needs: [build-image]
  before_script:
    # Git refuses operations on checkouts it does not "own" (recent git);
    # $(pwd) keeps this namespace-independent.
    - git config --global --add safe.directory "$(pwd)"
  script:
    # Deps are already installed + precompiled in the image, so there is
    # nothing to instantiate here. Test dependencies (Test) are declared in
    # [extras]/[targets] of Project.toml, which also makes
    # `Pkg.test("SuperfluidDynamics")` (i.e. `]test` from a registry install)
    # work from the root environment.
    - julia -e 'using Pkg; Pkg.activate("."); Pkg.instantiate()'
    - julia --project=. test/runtests.jl
    - julia -e 'using Pkg; Pkg.test()'
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

pages:
  image: $CI_REGISTRY_IMAGE/ci:sha-$CI_COMMIT_SHORT_SHA
  stage: deploy
  needs: [build-image]
  before_script:
    - git config --global --add safe.directory "$(pwd)"
    # Materialise the doc checkpoints (docs/save/*.h5, git-LFS): the runner
    # checkout may leave 131-byte LFS pointers, which would break the example
    # restart-from-checkpoint (read!) and force a full recompute.
    - git lfs install && git lfs pull
  script:
    # Documentation stack (already cached/precompiled in the image).
    # Doc stack ships precompiled in the image; this is an idempotency guard.
    - julia -e 'using Pkg; Pkg.activate("."); Pkg.instantiate(); Pkg.add(["Documenter","Literate","WGLMakie","JSServe","CairoMakie"]); Pkg.status()'
    - julia --project --color=yes docs/make.jl
    - echo "clean directory"
    - rm -rv docs/build/generated/res-* docs/build/generated/GPS.pvd
    - echo "move to public website"
    - mv docs/build public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
